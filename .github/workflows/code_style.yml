name: Code Style

on:
    push:
        branches: [ master ]
    pull_request:

jobs:
    code-style:
        name: PHP CS Fixer, PHPStan
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    tools: composer:v2
                    coverage: none

            -   name: Get composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache composer dependencies
                uses: actions/cache@v5
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-composer-code-style-${{ hashFiles('composer.json') }}
                    restore-keys: ${{ runner.os }}-composer-code-style-

            # optional package, its classes are used in code, so it is needed for static analysis
            -   name: Require knplabs/doctrine-behaviors
                run: composer require --dev --no-update "knplabs/doctrine-behaviors:^3.0"

            -   name: Install dependencies
                run: composer update --no-progress --optimize-autoloader

            # tools are installed by composer, so the same versions are used locally and in CI
            -   name: Run PHP CS Fixer
                run: composer php-cs-fixer

            -   name: Run PHPStan
                if: ${{ !cancelled() }}
                run: composer phpstan
