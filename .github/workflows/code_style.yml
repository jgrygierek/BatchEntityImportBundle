name: Code Style

on:
    push:
        branches: [ master ]
    pull_request:

# workflow only reads the repository, token does not need other permissions
permissions:
    contents: read

jobs:
    code-style:
        name: PHP CS Fixer, PHPStan, Rector
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    tools: composer:v2
                    coverage: none

            # optional package, its classes are used in code, so it is needed for static analysis
            -   name: Require knplabs/doctrine-behaviors
                run: composer require --dev --no-update "knplabs/doctrine-behaviors:^3.0"

            # caches downloaded packages and runs "composer update" (lock file is not committed)
            -   name: Install dependencies
                uses: ramsey/composer-install@v4
                with:
                    dependency-versions: highest

            # tools are installed by composer, so the same versions are used locally and in CI
            -   name: Run PHP CS Fixer
                run: composer php-cs-fixer

            -   name: Run PHPStan
                if: ${{ !cancelled() }}
                run: composer phpstan

            -   name: Run Rector
                if: ${{ !cancelled() }}
                run: composer rector
