name: Tests

on:
    push:
        branches: [ master ]
    pull_request:

jobs:
    tests:
        name: PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.dependencies }}${{ matrix.knplabs && ', KnpLabs' || '' }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ '8.4', '8.6' ]
                symfony: [ '7.4.*', '8.*' ]
                dependencies: [ lowest, highest ]
                knplabs: [ false ]
                include:
                    # knplabs/doctrine-behaviors is optional, so it is tested only with the oldest and the newest versions
                    -   php: '8.4'
                        symfony: '7.4.*'
                        dependencies: lowest
                        knplabs: true
                    -   php: '8.6'
                        symfony: '8.*'
                        dependencies: highest
                        knplabs: true

        env:
            # used by symfony/flex, without it packages from different versions of Symfony could be mixed
            SYMFONY_REQUIRE: ${{ matrix.symfony }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    tools: composer:v2, flex
                    coverage: pcov

            -   name: Get composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache composer dependencies
                uses: actions/cache@v5
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.symfony }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
                    restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.symfony }}-

            -   name: Require knplabs/doctrine-behaviors
                if: matrix.knplabs
                run: composer require --dev --no-update "knplabs/doctrine-behaviors:^3.0"

            -   name: Install dependencies
                run: composer update --no-progress --optimize-autoloader ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

            -   name: Run tests
                run: composer tests-cov

            -   name: Upload coverage report
                uses: codecov/codecov-action@v5
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
