name: Tests

on:
    push:
        branches: [ master ]
    pull_request:

# workflow only reads the repository, token does not need other permissions
permissions:
    contents: read

jobs:
    tests:
        name: PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.dependencies }}${{ matrix.knplabs && ', KnpLabs' || '' }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ '8.4', '8.6' ]
                symfony: [ '7.4.*', '8.*' ]
                dependencies: [ lowest, highest ]
                knplabs: [ false ]
                include:
                    # knplabs/doctrine-behaviors is optional, so it is tested only with the oldest and the newest versions
                    -   php: '8.4'
                        symfony: '7.4.*'
                        dependencies: lowest
                        knplabs: true
                    # coverage is measured only once, in the job which runs all tests (also these of KnpLabs)
                    -   php: '8.6'
                        symfony: '8.*'
                        dependencies: highest
                        knplabs: true
                        coverage: true

        env:
            # used by symfony/flex, without it packages from different versions of Symfony could be mixed
            SYMFONY_REQUIRE: ${{ matrix.symfony }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    tools: composer:v2, flex
                    coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
                    # assertions are disabled in production php.ini, without them assert() in code is not checked by tests
                    # and its line is reported as not covered
                    ini-values: zend.assertions=1

            -   name: Require knplabs/doctrine-behaviors
                if: matrix.knplabs
                run: composer require --dev --no-update "knplabs/doctrine-behaviors:^3.0"

            # caches downloaded packages and runs "composer update" (lock file is not committed)
            -   name: Install dependencies
                uses: ramsey/composer-install@v4
                with:
                    dependency-versions: ${{ matrix.dependencies }}
                    custom-cache-suffix: symfony-${{ matrix.symfony }}

            -   name: Run tests
                run: ${{ matrix.coverage && 'composer tests-cov' || 'composer tests' }}

            -   name: Upload coverage report
                if: matrix.coverage
                uses: codecov/codecov-action@v7
                with:
                    files: coverage.xml
                    token: ${{ secrets.CODECOV_TOKEN }}
