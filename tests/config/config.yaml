parameters:
    kernel.secret: "this_is_secret"

services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    JG\BatchEntityImportBundle\Tests\Fixtures\Controller\:
        resource: '../Fixtures/Controller'
        tags: [ 'controller.service_arguments' ]

    JG\BatchEntityImportBundle\Tests\DatabaseLoader: ~
    JG\BatchEntityImportBundle\Tests\Fixtures\Configuration\BaseConfiguration: ~

    Psr\Container\ContainerInterface:
        alias: service_container

    event_dispatcher:
        public: true
        class: JG\BatchEntityImportBundle\Tests\Fixtures\Event\TestableEventDispatcher
        decorates: ~
        arguments:
            - '@test.inner_dispatcher'

    test.inner_dispatcher:
        class: Symfony\Component\EventDispatcher\EventDispatcher

framework:
    test: true
    session:
        name: my_custom_php_session_id
        handler_id: ~
        storage_factory_id: session.storage.factory.mock_file

twig: ~

doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                driver: pdo_sqlite
                url: sqlite://root@localhost/var/batch_entity_import_test.db

    orm:
        auto_mapping: true
        mappings:
            Main:
                type: attribute
                prefix: JG\BatchEntityImportBundle\Tests\Fixtures\Entity
                dir: '%kernel.project_dir%/tests/Fixtures/Entity/'

security:
    firewalls:
        main:
            security: false
